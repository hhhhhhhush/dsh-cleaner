name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build all targets
        run: |
          chmod +x build.sh
          ./build.sh "${GITHUB_REF_NAME#v}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ### 下载 / Download

            | 平台 | 文件 |
            |---|---|
            | Windows 10/11 | `dsh-cleaner-windows-amd64.exe` |
            | macOS Intel | `dsh-cleaner-darwin-amd64` |
            | macOS Apple Silicon | `dsh-cleaner-darwin-arm64` |
            | Linux x86_64 | `dsh-cleaner-linux-amd64` |

            使用前请**完全退出 DeepSeek Harness**（含托盘图标）。
            Quit DeepSeek Harness completely (including the tray icon) before running.
